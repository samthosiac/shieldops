[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shieldops"
version = "0.1.0"
description = "Cybersecurity network traffic classification and analytics"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
